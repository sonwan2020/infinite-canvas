services:
  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    # Port 3000 is intentionally NOT published: traffic goes through the
    # authentik embedded outpost (published as 3000:9000 on the authentik
    # server container). See Proxy provider "infinite-canvas" in authentik.
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    networks:
      - default
      - authentik_default # so the authentik server container can proxy to http://infinite-canvas:3000
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID

networks:
  authentik_default:
    external: true
